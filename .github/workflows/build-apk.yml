name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip build-essential git \
            libffi-dev libssl-dev autoconf \
            libtool pkg-config cmake \
            python3-pip

      - name: Install Cython and Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install cython==0.29.33
          pip3 install buildozer

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'SPEC'
          [app]
          title = WiFi Analyzer
          package.name = wifianalyzer
          package.domain = org.wifianalyzer
          source.dir = .
          source.include_exts = py
          version = 1.0
          requirements = python3,kivy,psutil,speedtest-cli
          orientation = portrait
          android.permissions = INTERNET,ACCESS_WIFI_STATE,CHANGE_WIFI_STATE,ACCESS_NETWORK_STATE
          android.api = 30
          android.minapi = 21
          android.ndk = 23c
          android.sdk = 30
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          fullscreen = 0
          log_level = 2

          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg

      - name: Build APK with verbose output
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          # Initialize buildozer
          buildozer init
          # Build with verbose logging
          buildozer android debug --verbose 2>&1 | tee build.log

      - name: Check build log for errors
        if: failure()
        run: |
          echo "=== Build Log (last 100 lines) ==="
          tail -100 build.log
          echo "=== Looking for common errors ==="
          grep -i "error" build.log || echo "No errors found in log"
          grep -i "fail" build.log || echo "No failures found in log"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WiFiAnalyzer-APK
          path: bin/*.apk
          if-no-files-found: warn
