name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip
        pip3 install buildozer
    
    - name: Build APK
      run: |
        buildozer init
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app
        path: bin/*.apk
