name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip build-essential git \
            libffi-dev libssl-dev autoconf \
            libtool pkg-config cmake

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer kivy psutil speedtest-cli pillow

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'SPEC'
          [app]
          title = WiFi Analyzer Pro
          package.name = wifianalyzer
          package.domain = org.wifianalyzer
          source.dir = .
          source.include_exts = py,png,jpg
          version = 1.0
          requirements = python3,kivy==2.1.0,psutil,speedtest-cli
          orientation = portrait
          android.permissions = INTERNET,ACCESS_WIFI_STATE,CHANGE_WIFI_STATE,ACCESS_NETWORK_STATE,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          fullscreen = 0
          log_level = 2
          presplash.filename = %(source.dir)s/presplash.png
          icon.filename = %(source.dir)s/icon.png

          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC

      - name: Create icon and splash images
        run: |
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw
          
          # Create icon
          img = Image.new('RGBA', (512, 512), (33, 150, 243, 255))
          draw = ImageDraw.Draw(img)
          draw.rectangle([100, 100, 412, 412], fill=(255, 255, 255, 255))
          draw.text((180, 200), "WiFi", fill=(33, 150, 243, 255))
          img.save('icon.png')
          
          # Create presplash
          img2 = Image.new('RGBA', (1024, 1024), (33, 150, 243, 255))
          draw2 = ImageDraw.Draw(img2)
          draw2.text((300, 400), "WiFi Analyzer", fill=(255, 255, 255, 255))
          img2.save('presplash.png')
          PYEOF

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg

      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiAnalyzer-APK
          path: bin/*.apk
          if-no-files-found: warn
